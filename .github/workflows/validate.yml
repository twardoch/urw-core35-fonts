# this_file: .github/workflows/validate.yml
name: validate-fonts

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Verify upstream files and parse every font
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: python -m pip install --upgrade "fonttools>=4.50"

      - name: Validate inventory, upstream checksums, formats and corrected glyphs
        run: python -m unittest discover -s tests -v
